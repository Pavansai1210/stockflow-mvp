<label for="{{ field.id_for_label }}" {% if field.name == 'name' or field.name == 'description' %}class="span-2"{% endif %}>
  {{ field.label }}
  {{ field }}
  {% if field.help_text %}<span class="hint">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</label>
